        function v2ShowQuestion() {
            if (v2SelectedQuestionIndex === null) {
                return showPopup('Chưa chọn ô câu hỏi trong bảng.');
            }
            const q = v2Questions[v2SelectedQuestionIndex];
            if (!q) return;
            document.getElementById('v2qText').textContent = `${q.question}`;
            v2Answers = ["", "", "", ""];
        }

        /***********************************
         * V2 Board popup logic
         ***********************************/
        function openV2BoardPopup() {
            renderV2QuestionsAndBoard();
            document.getElementById('modalV2Board').style.display = 'flex';
        }
        function closeV2BoardPopup() {
            document.getElementById('modalV2Board').style.display = 'none';
        }
        function v2RevealAll() {
            v2Revealed = v2Revealed.map(() => true);
            renderV2QuestionsAndBoard();
            new Audio('DungCNV.mp3').play();
        }
        function v2SaveBoard() {
            if (v2SelectedQuestionIndex !== null) v2Questions[v2SelectedQuestionIndex].used = true;
            document.getElementById('modalV2Board').style.display = 'none';
        }

        function v2ResetBoard() {
            v2Questions.forEach(q => q.used = false);

            if (v2Revealed && v2Revealed.length > 0) {
                v2Revealed.fill(false);
            }

            v2SelectedQuestionIndex = null;
            const qTextEl = document.getElementById("v2qText");
            if (qTextEl) qTextEl.textContent = "";

            renderV2QuestionsAndBoard();
        }

        /***********************************
         * Render initial V2 placeholders
         ***********************************/
        function initDefaultV2() {
            v2Questions = [];
            for (let i = 0; i < 8; i++) v2Questions.push({ question: `Câu ${i + 1}`, answer: '', boardRaw: '', used: false });
            v2Board = new Array(30).fill(' ');
            v2Revealed = new Array(30).fill(false);
            renderV2QuestionsAndBoard();
        }

        /***********************************
         * On load
         ***********************************/
        window.onload = () => {
            document.querySelectorAll('.view-panel').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-opening').classList.remove('hidden');

            let saved = localStorage.getItem("playerScores");
            if (saved) {
                playerScores = JSON.parse(saved);
                for (let i = 0; i < 4; i++) {
                    if (document.getElementById(`score${i}`)) document.getElementById(`score${i}`).textContent = playerScores[i];
                }
            }

            for (let i = 0; i < 4; i++) {
                if (document.getElementById(`v2name${i}`)) document.getElementById(`v2name${i}`).textContent = document.getElementById(`name${i}`).textContent;
                if (document.getElementById(`v2score${i}`)) document.getElementById(`v2score${i}`).textContent = playerScores[i];
            }

            initDefaultV2();
        };

        const savedOption = localStorage.getItem("scoreOption");
        if (savedOption === "save") {
            const savedScores = JSON.parse(localStorage.getItem("playerScores") || "[30,30,30,30]");
            playerScores = savedScores;
        } else {
            playerScores = [30, 30, 30, 30];
        }

        function autoSaveScores() {
            const mode = localStorage.getItem("scoreOption");
            if (mode === "save") {
                localStorage.setItem("playerScores", JSON.stringify(playerScores));
            }
        }

        document.getElementById("btnOption").onclick = () => {
            document.getElementById("optionModal").style.display = "flex";
            const currentOpt = localStorage.getItem("scoreOption") || "reset";
            document.querySelectorAll('input[name="scoreOption"]').forEach(r => {
                r.checked = (r.value === currentOpt);
            });
        };

        document.getElementById("saveOptionBtn").onclick = () => {
            const selected = document.querySelector('input[name="scoreOption"]:checked').value;
            localStorage.setItem("scoreOption", selected);
            if (selected === "reset") {
                localStorage.removeItem("playerScores");
                playerScores = [30, 30, 30, 30];
            } else {
                localStorage.setItem("playerScores", JSON.stringify(playerScores));
            }
            document.getElementById("optionModal").style.display = "none";
        };

        document.getElementById("closeOptionBtn").onclick = () => {
            document.getElementById("optionModal").style.display = "none";
        };

        /*************** VÒNG 3 ***************/
        let v3Data = [];
        let v3Current = 0;
        let v3Timer = 30;
        let v3Interval = null;
        let v3Answers = [{ name: '', ans: '', time: '' }, { name: '', ans: '', time: '' }, { name: '', ans: '', time: '' }, { name: '', ans: '', time: '' }];

        function v3ShowQuestion() {
            const q = v3Data[v3Current];
            if (!q) return showPopup("Chưa có dữ liệu câu hỏi!");
            document.getElementById('v3QuestionBox').textContent = `${v3Current + 1}. ${q.question}`;
            document.getElementById('v3QuestionBox').classList.add('revealed');
            new Audio('QuestionShowing.mp3').play();
        }

        function v3RevealHint(i) {
            const q = v3Data[v3Current];
            if (!q) return;
            const el = document.getElementById('v3Hint' + i);
            el.textContent = q['g' + i];
            el.classList.add('revealed');
        }

        let v3Music = new Audio("30s Chinh Phục.mp3");

        function v3Start() {
            v3Timer = 30;
            const timerBox = document.getElementById('v3Timer');
            timerBox.textContent = v3Timer;

            timerBox.style.background = "blue";
            timerBox.style.color = "white";

            v3Music.currentTime = 0;
            v3Music.play();

            clearInterval(v3Interval);
            v3RevealHint(1);

            v3Interval = setInterval(() => {
                v3Timer--;
                timerBox.textContent = v3Timer;

                if (v3Timer > 20) {
                    timerBox.style.background = "blue";
                    timerBox.style.color = "white";
                } else if (v3Timer > 10) {
                    timerBox.style.background = "yellow";
                    timerBox.style.color = "black";
                } else {
                    timerBox.style.background = "red";
                    timerBox.style.color = "white";
                }

                if (v3Timer === 20) v3RevealHint(2);
                if (v3Timer === 10) v3RevealHint(3);

                if (v3Timer <= 0) {
                    clearInterval(v3Interval);
                }
            }, 1000);
        }

        function v3Close() {
            clearInterval(v3Interval);
            v3Music.pause();
            v3Music.currentTime = 0;

            const ids = ['v3QuestionBox', 'v3Hint1', 'v3Hint2', 'v3Hint3'];
            for (const id of ids) {
                const el = document.getElementById(id);
                el.textContent = "";
                el.classList.remove('revealed');
            }

            v3Timer = 30;
            const timerBox = document.getElementById('v3Timer');
            timerBox.textContent = v3Timer;
            timerBox.style.background = "blue";
            timerBox.style.color = "white";
        }

        function openV3Input() {
            for (let i = 0; i < 4; i++) {
                v3Answers[i].ans = "";
                v3Answers[i].time = "";
                document.getElementById('v3Name' + i).value = document.getElementById('name' + i).textContent;
                document.getElementById('v3Ans' + i).value = v3Answers[i].ans || '';
                document.getElementById('v3Time' + i).value = v3Answers[i].time || '';
            }
            document.getElementById('modalV3Input').style.display = 'flex';
        }
        document.getElementById('closeV3Inp').onclick = () => document.getElementById('modalV3Input').style.display = 'none';
        document.getElementById('saveV3Ans').onclick = () => {
            for (let i = 0; i < 4; i++) {
                v3Answers[i].name = document.getElementById('v3Name' + i).value;
                v3Answers[i].ans = document.getElementById('v3Ans' + i).value;
                v3Answers[i].time = document.getElementById('v3Time' + i).value;
            }
            document.getElementById('modalV3Input').style.display = 'none';
        };

        function openV3Show() {
            new Audio('AnswersShowing.mp3').play();
            const area = document.getElementById('v3ShowArea');
            area.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const playerName = document.getElementById('name' + i).textContent || `Người ${i + 1}`;

                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
    <div class="row-top">
        <div class="ans-name">${playerName}</div>
        <div class="ans-time">${v3Answers[i].time || ''}</div>
    </div>
    <div class="ans-text">${v3Answers[i].ans || ''}</div>
`;
                area.appendChild(item);
            }
            document.getElementById('modalV3Show').style.display = 'flex';
        }
        document.getElementById('closeV3Show').onclick = () => document.getElementById('modalV3Show').style.display = 'none';

        function v3Next() {
            clearInterval(v3Interval);

            if (!v3Data || v3Data.length === 0) {
                showPopup("⚠️ Chưa có dữ liệu Vòng 3!");
                return;
            }

            v3Current++;
            if (v3Current >= v3Data.length) {
                v3Current = 0;
            }

            ['v3QuestionBox', 'v3Hint1', 'v3Hint2', 'v3Hint3'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('revealed');
                el.textContent = "";
            });

            v3Timer = 30;
            document.getElementById('v3Timer').textContent = v3Timer;
        }

        /* V4 state */
        let v4Index = -1;
        let v4Timer = 0;
        let v4Interval = null;
        let v4UsedScores = {};
        let v4BracketState = [0, 0, 0, 0];
        let v4LastYellow = -1;
        let v4PrevColors = ['blue', 'blue', 'blue', 'blue'];

        function v4SyncNamesAndScores() {
            for (let i = 0; i < 4; i++) {
                const nameEl = document.getElementById(`name${i}`);
                const v4name = document.getElementById(`v4name${i}`);
                if (nameEl && v4name) {
                    const newName = nameEl.textContent;
                    const isBetting = v4name.textContent.includes('(');
                    if (isBetting) {
                        v4name.textContent = `(${newName})`;
                    } else {
                        v4name.textContent = newName;
                    }
                }
                const newScore = playerScores[i];
                const v4score = document.getElementById(`v4score${i}`);

                if (v4score) {
                    const isBetting = v4score.textContent.includes('(');
                    if (isBetting) {
                        v4score.textContent = `(${newScore})`;
                    } else {
                        v4score.textContent = newScore;
                    }
                }
            }
        }

        function v4SetPlayerState(playerIndex, state) {
            const el = document.getElementById(`v4box${playerIndex}`);
            if (!el) return;

            let prevState = v4PrevColors[playerIndex];

            if (state === 'blue') {
                el.style.background = 'var(--blue)';
                el.style.color = 'white';
            } else if (state === 'yellow') {
                el.style.background = 'yellow';
                el.style.color = 'black';
                new Audio('Star.mp3').play();
            } else if (state === 'pink') {
                el.style.background = '#ff00cc';
                el.style.color = 'white';
                new Audio('Chuông V4.mp3').play();

                if (prevState === 'yellow') {
                    v4BracketState[playerIndex]++;
                    if (v4BracketState[playerIndex] > 2) {
                        v4BracketState[playerIndex] = 0;
                    }
                    updateV4Bracket(playerIndex);
                }
            } else if (state === 'black') {
                el.style.background = 'black';
                el.style.color = 'white';
            }

            v4PrevColors[playerIndex] = state;
            el.style.fontWeight = 'bold';
        }

        function updateV4Bracket(playerIndex) {
            const nameEl = document.getElementById(`v4name${playerIndex}`);
            const scoreEl = document.getElementById(`v4score${playerIndex}`);
            if (!nameEl || !scoreEl) return;

            let cleanName = nameEl.textContent.replace(/[()]/g, "");
            let currentScore = playerScores[playerIndex];
            let bracketLevel = v4BracketState[playerIndex];

            if (bracketLevel === 1) {
                nameEl.textContent = `(${cleanName})`;
                scoreEl.textContent = currentScore;
            } else if (bracketLevel === 2) {
                nameEl.textContent = `(${cleanName})`;
                scoreEl.textContent = `(${currentScore})`;
            } else {
                nameEl.textContent = cleanName;
                scoreEl.textContent = currentScore;
            }
        }

        /* START TIMER */
        let v4Music = new Audio("15s Về Đích.mp3");
        let v4Time = 15;
        let v4Paused = false;

        function v4StartTimer() {
            v4Music.currentTime = 0;
            v4Music.play();

            clearInterval(v4Interval);
            v4Time = 15;

            const box = document.getElementById('v4TimeBox');

            v4Interval = setInterval(() => {
                if (v4Paused) return;

                v4Time--;
                box.textContent = v4Time;

                const percent = ((15 - v4Time) / 15) * 100;
                box.style.background = `linear-gradient(to bottom, #ff00cc ${percent}%, blue ${percent}%)`;

                if (v4Time <= 0) clearInterval(v4Interval);
            }, 1000);
        }

        /* CLOSE QUESTION */
        function v4CloseQuestion() {
            clearInterval(v4Interval);
            v4Music.pause();
            v4Music.currentTime = 0;

            document.getElementById('v4qText').textContent = '';
            const box = document.getElementById('v4TimeBox');
            box.textContent = '15';
            box.style.background = "blue";
            box.style.color = "white";
            v4Paused = false;

            const btn = document.getElementById("v4PauseBtn");
            if (btn) btn.textContent = "Tạm dừng";
        }

        function v4NextQuestion() {
            if (!v4Questions || v4Questions.length === 0) return;

            v4Index++;

            if (v4Index >= v4Questions.length) {
                v4Index = 0;
            }
            const qText = document.getElementById("v4qText");
            if (qText) qText.textContent = "";

            clearInterval(v4Interval);
            v4Timer = 15;
            const timeBox = document.getElementById("v4TimeBox");
            if (timeBox) {
                timeBox.textContent = v4Timer;
                timeBox.style.background = "var(--blue)";
            }
        }

        function v4ShowQuestion() {
            // Tự động chuyển chỉ số về câu thứ nhất (0) nếu vừa nạp file xong (index đang là -1)
            if (v4Index === -1 && v4Questions.length > 0) {
                v4Index = 0;
            }
            if (v4Index < 0 || v4Index >= v4Questions.length) return;

            const q = v4Questions[v4Index];
            const qText = document.getElementById("v4qText");
            if (qText) {
                qText.textContent = q.question;
            }
        }

        function toggleV4Pause() {
            const btn = document.getElementById("v4PauseBtn");
            v4Paused = !v4Paused;

            if (v4Paused) {
                v4Music.pause();
                btn.textContent = "Tiếp tục";
            } else {
                v4Music.play();
                btn.textContent = "Tạm dừng";
            }
        }

        function openV4RemoveBetPopup() {
            for (let i = 0; i < 4; i++) {
                let cleanName = document.getElementById(`v4name${i}`).textContent.replace(/[()]/g, "").trim();
                document.getElementById(`removeName${i}`).textContent = cleanName;
            }
            document.getElementById("modalV4RemoveBet").style.display = "flex";
        }

        document.getElementById("closeRemoveBetBtn").onclick = () => {
            document.getElementById("modalV4RemoveBet").style.display = "none";
        };

        document.getElementById("saveRemoveBetBtn").onclick = () => {
            const selected = document.querySelector('input[name="removeBet"]:checked');
            if (!selected) return;

            const i = parseInt(selected.value);
            const nameEl = document.getElementById(`v4name${i}`);
            const scoreEl = document.getElementById(`v4score${i}`);

            nameEl.textContent = nameEl.textContent.replace(/[()]/g, "").trim();
            scoreEl.textContent = scoreEl.textContent.replace(/[()]/g, "").trim();

            document.getElementById("modalV4RemoveBet").style.display = "none";
        };

        /***********************************
        * CÂU HỎI PHỤ
        ***********************************/
        let vqphuData = [];
        let vqphuIndex = 0;
        let vqphuTimer = 20;
        let vqphuTimerInterval = null;
        let vqphuAnswers = [];
        let vqphuRevealed = false;

        function renderVQPhu() {
            const q = vqphuData[vqphuIndex];
            if (!q) return;
            document.getElementById('vqphuQuestion').textContent = q.question || "";
            const left = document.getElementById('vqphuLeft');
            const right = document.getElementById('vqphuRight');
            left.innerHTML = right.innerHTML = "";
            for (let i = 1; i <= 8; i++) {
                const text = q[`event${i}`] || "";
                const div = document.createElement('div');
                div.textContent = vqphuRevealed ? `${i}. ${text}` : "";
                div.style.background = "blue";
                div.style.color = "white";
                div.style.fontWeight = "bold";
                div.style.borderRadius = "10px";
                div.style.textAlign = "center";
                div.style.height = "70px";
                div.style.display = "flex";
                div.style.alignItems = "center";
                div.style.justifyContent = "center";
                div.style.fontSize = (text.length > 50 ? "0.8rem" : "1rem");
                if (i <= 4) left.appendChild(div);
                else right.appendChild(div);
            }
        }

        let vqphuMusic = new Audio("20s Câu Hỏi Phụ.mp3");
        function vqphuStartTimer() {
            clearInterval(vqphuTimerInterval);
            vqphuTimer = 20;

            const box = document.getElementById('vqphuTimeBox');
            box.textContent = vqphuTimer;
            box.style.background = "blue";
            box.style.color = "white";

            vqphuMusic.currentTime = 0;
            vqphuMusic.play();

            vqphuTimerInterval = setInterval(() => {
                vqphuTimer--;
                box.textContent = vqphuTimer;

                if (vqphuTimer > 10) {
                    box.style.background = "blue";
                    box.style.color = "white";
                } else {
                    box.style.background = "red";
                    box.style.color = "white";
                }

                if (vqphuTimer <= 0) {
                    clearInterval(vqphuTimerInterval);
                }
            }, 1000);
        }

        function vqphuCloseQuestion() {
            clearInterval(vqphuTimerInterval);
            vqphuMusic.pause();
            vqphuMusic.currentTime = 0;

            document.getElementById('vqphuQuestion').textContent = "";
            document.getElementById('vqphuLeft').innerHTML = "";
            document.getElementById('vqphuRight').innerHTML = "";
            vqphuRevealed = false;

            vqphuTimer = 20;
            const box = document.getElementById('vqphuTimeBox');
            box.textContent = vqphuTimer;
            box.style.background = "blue";
            box.style.color = "white";
        }

        function vqphuNext() {
            vqphuIndex = (vqphuIndex + 1) % vqphuData.length;
            document.getElementById('vqphuQuestion').textContent = "";
            document.getElementById('vqphuLeft').innerHTML = "";
            document.getElementById('vqphuRight').innerHTML = "";
            vqphuRevealed = false;
        }

        function vqphuReveal() {
            vqphuRevealed = true;
            renderVQPhu();
        }

        function openVQPhuInput() {
            const modal = document.getElementById('modalVQPhuInput');
            modal.style.display = 'flex';
            modal.style.zIndex = '9999';
            const cont = document.getElementById('vqphuInputContainer');
            cont.innerHTML = `
    <label style="display:block;text-align:center;font-weight:bold;margin-bottom:6px;">
      Nhập số lượng người chơi (2-16):
    </label>
    <input id="vqphuNumPlayers" type="number" min="2" max="16" value="4"
           style="width:100%;text-align:center;font-weight:bold;">
    <div id="vqphuInputs" style="margin-top:8px;"></div>
  `;
            document.getElementById('vqphuNumPlayers').onchange = () => buildVQPhuInputs();
            buildVQPhuInputs();
        }

        function buildVQPhuInputs() {
            const n = parseInt(document.getElementById('vqphuNumPlayers').value) || 4;
            const box = document.getElementById('vqphuInputs');
            box.innerHTML = "";
            for (let i = 0; i < n; i++) {
                box.innerHTML += `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:6px;">
        <input placeholder="Tên người chơi ${i + 1}">
        <input placeholder="Đáp án">
        <input placeholder="Thời gian (s)">
      </div>`;
            }
        }

        function vqphuSaveInput() {
            const n = parseInt(document.getElementById('vqphuNumPlayers').value) || 4;
            const rows = [...document.querySelectorAll('#vqphuInputs > div')];
            vqphuAnswers = rows.map(row => {
                const inputs = row.querySelectorAll('input');
                return {
                    name: inputs[0].value || `Người ${rows.indexOf(row) + 1}`,
                    ans: inputs[1].value || "",
                    time: inputs[2].value || ""
                };
            });
            document.getElementById('modalVQPhuInput').style.display = 'none';
        }

        function openVQPhuShow() {
            if (!vqphuAnswers || vqphuAnswers.length === 0) return;

            const container = document.getElementById("vqphuShowArea");
            const pagesBar = document.getElementById("vqphuShowPages");

            let page = 0;
            const perPage = 4;
            const totalPages = Math.ceil(vqphuAnswers.length / perPage);

            function renderPage() {
                container.innerHTML = "";
                const start = page * perPage;
                const end = Math.min(start + perPage, vqphuAnswers.length);

                for (let i = start; i < end; i++) {
                    const item = vqphuAnswers[i];
                    const div = document.createElement("div");
                    div.className = "vqphu-item";
                    div.innerHTML = `
                <div class="vqphu-row-top">
                    <div class="vqphu-name">${item.name}</div>
                    <div class="vqphu-time">${item.time || ""}</div>
                </div>
                <div class="vqphu-ans">${item.ans || ""}</div>
            `;
                    container.appendChild(div);
                }

                pagesBar.innerHTML = "";
                for (let p = 0; p < totalPages; p++) {
                    const btn = document.createElement("button");
                    btn.textContent = p + 1;

                    btn.style.width = "32px";
                    btn.style.height = "32px";
                    btn.style.borderRadius = "6px";
                    btn.style.fontWeight = "bold";
                    btn.style.textAlign = "center";
                    btn.style.border = "none";
                    btn.style.cursor = "pointer";

                    if (p === page) {
                        btn.style.background = "aqua";
                        btn.style.color = "black";
                    } else {
                        btn.style.background = "blue";
                        btn.style.color = "white";
                    }

                    btn.onclick = () => {
                        page = p;
                        renderPage();
                    };

                    pagesBar.appendChild(btn);
                }
            }

            renderPage();
            document.getElementById("modalVQPhuShow").style.display = "flex";
        }

        function closeVQPhuShow() {
            document.getElementById('modalVQPhuShow').style.display = 'none';
        }
        function closeVQPhuInput() {
            document.getElementById('modalVQPhuInput').style.display = 'none';
        }
    </script>
</body>

</html>
